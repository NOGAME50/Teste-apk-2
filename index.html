<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOGAME MARKET — Vidéo de présentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#101d38;--blue:#1769d2;--orange:#f28c28;--orange-d:#e87512;--teal:#20b8b0;--paper:#f3f6fa;--line:#e6ebf2;--muted:#718096;--text:#17243b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05080f;overflow:hidden;font-family:Manrope,"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
#viewport{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:linear-gradient(165deg,#0b1730 0%,#14397a 62%,#1769d2 120%);isolation:isolate}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- fond ---------- */
#glow{position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,#f28c2866 0%,transparent 65%);left:-300px;top:900px;z-index:0}
#glow2{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#20b8b038 0%,transparent 65%);right:-350px;top:-250px;z-index:0}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b1730f2,#0b1730e6 40%,#0b1730fa)}

/* ---------- intro / outro ---------- */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5}
.emblem-box{width:300px;height:300px;border-radius:80px;background:#fff;display:grid;place-items:center;box-shadow:0 40px 100px #0008}
.emblem-box img{width:230px;height:220px;object-fit:contain}
.word{margin-top:56px;display:flex;flex-direction:column;align-items:center;line-height:.95}
.word b{font-size:132px;font-weight:800;color:#fff;letter-spacing:1px}
.word span{font-size:122px;font-weight:800;color:var(--orange);margin-top:6px}
.tags{display:flex;gap:26px;margin-top:64px;font-size:50px;font-weight:800;color:#fff}
.tags span{opacity:0}
.tagline{margin-top:46px;font-size:40px;font-weight:700;color:#cfe0fb;max-width:800px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:16px 34px;border-radius:999px;background:var(--orange);color:#fff;font-size:36px;font-weight:800}
.cta{margin-top:56px;display:inline-flex;align-items:center;gap:20px;padding:34px 66px;border-radius:30px;background:var(--orange);color:#fff;font-size:48px;font-weight:800;box-shadow:0 24px 60px #f28c2866}
.cta svg{font-size:54px}

/* ---------- légendes ---------- */
.cap{position:absolute;left:60px;right:60px;top:96px;text-align:center;z-index:6;opacity:0}
.cap .chip{font-size:30px;padding:12px 28px}
.cap h2{margin-top:30px;font-size:88px;line-height:1.04;font-weight:800;color:#fff;letter-spacing:-1px}
.cap p{margin-top:24px;font-size:40px;line-height:1.28;font-weight:700;color:#cfe0fb}

/* ---------- téléphone ---------- */
#phone{position:absolute;left:190px;top:520px;width:700px;height:1380px;border-radius:92px;background:#0a0f1c;border:3px solid #2b3858;box-shadow:0 60px 140px #000a,inset 0 0 0 2px #000;z-index:4;opacity:0}
#island{position:absolute;left:50%;top:34px;width:170px;height:46px;margin-left:-85px;border-radius:30px;background:#000;z-index:30}
#screen{position:absolute;inset:18px;border-radius:74px;overflow:hidden;background:#f3f6fa}
.app{position:absolute;left:0;top:0;width:390px;height:789px;transform:scale(1.7026);transform-origin:0 0;background:var(--paper);overflow:hidden;color:var(--text);font-size:14px}
.app *{box-sizing:border-box}
.status{position:absolute;left:0;right:0;top:0;height:32px;background:#fff;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:13px;font-weight:800}
.status .r{display:flex;gap:5px;align-items:center}
.bat{width:22px;height:11px;border:1.5px solid #17243b;border-radius:3.5px;position:relative;padding:1.5px}
.bat::after{content:"";display:block;height:100%;width:78%;background:#17243b;border-radius:1.5px}
.sig{display:flex;gap:1.5px;align-items:flex-end;height:11px}
.sig i{display:block;width:3px;background:#17243b;border-radius:1px}
.topbar{position:absolute;left:0;right:0;top:32px;height:56px;z-index:19;background:#fffffff2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:38px;height:38px;object-fit:contain;border-radius:10px}
.wm{display:flex;flex-direction:column;line-height:.98}
.wm strong{font-size:15px;font-weight:800;color:#09245e}
.wm b{font-size:14px;font-weight:800;color:var(--orange);margin-top:2px}
.hact{display:flex;gap:8px}
.hbtn{width:36px;height:36px;border-radius:12px;background:#eef4ff;display:grid;place-items:center;font-size:19px;color:#34445d;position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#e5484d;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;opacity:0}
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:19;background:#fff;border-top:1px solid var(--line);display:flex}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;font-weight:800;color:#7b8798}
.nav div svg{font-size:22px;stroke-width:2.3}
.nav div.on{color:#e98220}
.scr{position:absolute;left:0;right:0;top:88px;bottom:0;background:var(--paper);overflow:hidden;display:none}
.sc{padding:16px 16px 90px;will-change:transform}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--blue)}
h1.t{font-size:27px;line-height:1.1;margin:8px 0 8px;font-weight:800}
p.m{color:var(--muted);font-size:13.5px;line-height:1.4}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 14px 40px #0a1a4f12}
.stack{display:grid;gap:13px;margin-top:14px}
.lab{display:grid;gap:6px;font-size:12.5px;font-weight:800}
.inp{min-height:42px;border:1px solid #d7e0ed;border-radius:12px;padding:0 12px;background:#fff;display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--text);transition:none}
.inp>svg{color:var(--muted);font-size:17px}
.inp.ta{align-items:flex-start;min-height:78px;padding-top:11px;line-height:1.35}
.inp.focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769d21c}
.val:empty::before{content:attr(data-ph);color:#9aa5b5;font-weight:500}
.inp.focus .val::after{content:"";display:inline-block;width:2px;height:15px;background:var(--blue);vertical-align:text-bottom;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:13px 16px;font-weight:800;font-size:14px;font-family:inherit}
.btn svg{font-size:18px}
.bp{background:var(--blue);color:#fff}.bo{background:var(--orange);color:#fff}.bl{background:#edf3fc;color:var(--navy)}
.pressed{transform:scale(.95)!important;filter:brightness(.92)}
.role{padding:11px 14px;border-radius:14px;border:1px solid #d7e0ed;background:#fff;display:grid;gap:1px}
.role b{font-size:14px}.role small{color:#6b7a90;font-size:11.5px}
.role.sel{border:2px solid var(--orange);background:#fff6ea;padding:10px 13px}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;color:#6b7a90;font-size:12px}
.or i{flex:1;height:1px;background:#dfe6f1}
.notice{padding:12px 14px;background:#fff8ed;border:1px solid #f1ddba;border-radius:14px;color:#77501f;font-size:12.5px;font-weight:700}
.empty{padding:18px;background:#fff;border:1px dashed #cbd8ed;border-radius:18px;color:var(--muted);font-size:13.5px;margin:14px 0}
.empty u{color:var(--blue);font-weight:800;text-decoration:none}
.shopcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px #1a3a8a0c}
.logo{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;background:linear-gradient(135deg,var(--orange),#e0561b);align-self:center}
.shopcard small{display:flex;align-items:center;gap:5px;color:var(--muted)}
.ar{display:flex;gap:8px;flex-wrap:wrap}
.ar .btn{padding:10px 12px;font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.file{display:flex;align-items:center;gap:10px;min-height:46px;border:1px dashed #b7c6df;border-radius:12px;padding:6px 12px;color:var(--muted);font-weight:700;font-size:13px}
.file .th{width:34px;height:34px;border-radius:9px;overflow:hidden;display:none}
.file .th svg{width:100%;height:100%}
.file .fn{color:var(--text)}
.file.ok{border-style:solid;border-color:#9fd9c4;background:#f1fbf7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:10px}
.row b{display:block;font-size:14px}.row small{color:var(--muted);font-size:12px}
.ib{width:32px;height:32px;border-radius:10px;background:#edf3fc;display:grid;place-items:center;font-size:15px;color:#34445d}
.ib.d{color:#c0392b}
.toast{position:absolute;left:16px;right:16px;bottom:78px;z-index:25;background:#101d38;color:#fff;border-radius:14px;padding:13px 16px;font-weight:800;font-size:13.5px;display:flex;gap:10px;align-items:center;opacity:0}
.toast svg{color:#5fe0a6;font-size:18px}
.overlay{position:absolute;inset:0;z-index:40;background:#ffffffee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:800;font-size:19px;text-align:center}
.okc{width:84px;height:84px;border-radius:50%;background:#1faa72;color:#fff;display:grid;place-items:center;font-size:46px}
.overlay small{font-size:13px;color:var(--muted);font-weight:700}

/* accueil */
.msearch{display:flex;align-items:center;gap:11px;min-height:50px;padding:0 10px 0 14px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 3px 12px #101d3809;font-size:13.5px;font-weight:600}
.msearch.focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769d21a}
.msearch>svg{font-size:20px;color:var(--muted)}
.msearch .val{flex:1}
.msearch .flt{width:36px;height:36px;border-radius:11px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:18px}
.hero{position:relative;margin-top:14px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#071b50;box-shadow:0 8px 24px #101d3822}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:#ffffff80}.dots i.on{width:18px;background:#fff}
.short{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0 6px}
.short div{display:grid;justify-items:center;gap:7px;background:#fff;border-radius:16px;padding:13px 4px;box-shadow:0 8px 22px #1a3a8a12;font-weight:800;font-size:11px}
.short svg{font-size:23px;color:var(--blue)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:20px 0 11px}
.sh h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
.sh h3 i{width:5px;height:19px;border-radius:3px;background:var(--orange)}
.sh span{color:var(--blue);font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:4px}
.srow{display:flex;gap:11px;overflow:hidden}
.nms{flex:none;width:122px;display:grid;justify-items:center;gap:5px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 8px;box-shadow:0 6px 18px #1a3a8a0c}
.nms .logo{width:56px;height:56px;font-size:19px}
.nms b{font-size:12.5px;line-height:1.15}.nms small{font-size:10.5px;color:var(--muted)}
.nms em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--orange);background:#fff1e0;border-radius:999px;padding:5px 9px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 8px 22px #1a3a8a0c}
.pph{position:relative;height:128px;background:#eef3fa}
.pph svg{width:100%;height:100%;display:block}
.fav{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:#ffffffee;display:grid;place-items:center;color:#51607a;font-size:15px}
.pi{padding:11px;display:grid;gap:5px}
.pi .eyebrow{font-size:10px}
.pn{font-weight:800;font-size:13.5px;line-height:1.2}
.pp{font-size:16px;font-weight:800;color:var(--orange)}
.ps{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
.ps svg{font-size:12px}
.pc.hide{display:none}
.filtered .pc.hide{display:none}
.msg-empty{display:none}
.filtered .shops-full{display:none}
.filtered .msg-empty{display:block}

/* détail */
.dimg{height:250px;border-radius:20px;overflow:hidden;background:#eef3fa;margin-bottom:14px}
.dimg svg{width:100%;height:100%;display:block}
.dprice{font-size:26px;font-weight:800;color:var(--orange);margin:6px 0 10px}
.dd{display:grid;gap:10px;margin-top:16px}

/* chat */
.chat{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 14px 70px}
.chead{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.chead .ib{width:38px;height:38px;font-size:19px}
.chead div.tt{flex:1;display:grid}.chead small{color:var(--muted);font-size:11px;font-weight:700}
.cbody{flex:1;display:flex;flex-direction:column;gap:8px;padding:6px 2px;overflow:hidden;justify-content:flex-end}
.bub{max-width:82%;padding:9px 13px;border-radius:18px;display:grid;gap:3px;font-size:14px;line-height:1.35;font-weight:600;opacity:0}
.bub small{font-size:10px;opacity:.65}
.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:4px;opacity:0}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa5b5;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-4px)}}
.cform{display:flex;gap:9px;align-items:center;padding-top:8px}
.cform .inp{flex:1;min-height:46px;border-radius:16px}
.cform .btn{width:46px;height:46px;padding:0;border-radius:15px}

/* sélecteur de photos (stockage) */
.sw{position:absolute;inset:0;z-index:44;display:none}
.sbg{position:absolute;inset:0;background:#000;opacity:0}
.spanel{position:absolute;left:0;right:0;bottom:0;height:500px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px #0004;overflow:hidden;transform:translateY(100%)}
.grab{width:40px;height:4px;border-radius:2px;background:#cfd6e2;margin:8px auto 0}
.sph{display:flex;align-items:center;gap:12px;padding:10px 14px 8px}
.sph .ib{width:34px;height:34px}
.sph b{display:block;font-size:15px}.sph small{color:var(--muted);font-size:11px;font-weight:700}
.chips{display:flex;gap:8px;padding:0 14px 10px}
.chips span{padding:6px 12px;border-radius:999px;background:#eef2f8;font-size:11.5px;font-weight:800;color:#51607a}
.chips span.on{background:#101d38;color:#fff}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px}
.tl{position:relative;aspect-ratio:1;overflow:hidden;background:#eef3fa}
.tl svg.art{width:100%;height:100%;display:block}
.tl.cam{display:grid;place-items:center;align-content:center;gap:6px;background:#101d38;color:#fff;font-size:30px}
.tl.cam small{font-size:10.5px;font-weight:800}
.tl .ck{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:15px;box-shadow:0 0 0 2px #fff}
.tl .ck svg{stroke-width:3}
.tl.sel .ck{display:grid}
.tl.sel::after{content:"";position:absolute;inset:0;border:4px solid var(--blue);background:#1769d233}
/* tap */
#tap{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;z-index:50;pointer-events:none;opacity:0}
#tap::before{content:"";position:absolute;inset:0;border-radius:50%;border:6px solid #fff;background:#ffffff40}
#tap::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;box-shadow:0 6px 24px #0007}

/* contrôles (hors vidéo) */
#ctl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:100;background:#101d38e6;border:1px solid #2b3858;border-radius:999px;padding:8px 10px;color:#fff;font:700 13px Manrope,system-ui,sans-serif;backdrop-filter:blur(8px)}
#ctl button{border:0;border-radius:999px;padding:9px 14px;background:#1c2d52;color:#fff;font:inherit;cursor:pointer}
#ctl button.rec{background:var(--orange)}
#bar{width:150px;height:6px;border-radius:3px;background:#2b3858;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--orange)}
#hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;background:#101d38e6;color:#cfe0fb;border-radius:12px;padding:9px 14px;font:700 12.5px Manrope,system-ui,sans-serif;text-align:center;max-width:92vw}
body.rec #ctl,body.rec #hint{display:none}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
</style>
</head>
<body>
<div id="viewport">
